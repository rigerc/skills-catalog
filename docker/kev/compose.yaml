# Local Kev-4B (Kev 1.0) inference server for skill evaluation.
# Start:     docker compose -f docker/kev/compose.yaml up -d --build
# Smoke test: node docker/kev/smoke-test.mjs
services:
  kev:
    build:
      context: .
      args:
        # Kev source ref for the image. The released Kev-4B checkpoint is pinned
        # separately as jaredpalmer/kev-4b@v1.0 in the container command.
        KEV_GIT_REF: ${KEV_GIT_REF:-kev-1.0}
    image: skills-catalog-kev-4b
    # Loopback-only: the evaluator talks to http://127.0.0.1:8009. The container binds
    # 0.0.0.0 internally; the host never exposes 8009 beyond the loopback interface.
    ports:
      - "${KEV_BIND_HOST:-127.0.0.1}:8009:8009"
    environment:
      # Documents are never truncated to fit the context; oversized states get a 422.
      # The evaluator additionally refuses a server reporting truncation.
      KEV_TRUNCATE_STATES: "0"
      # Unset = open localhost server. Set it here and in KEV_API_KEY for the evaluator
      # to require bearer authentication.
      KEV_API_KEY: ${KEV_API_KEY:-}
      # Optional: fp32 serves the exact evaluation path instead of the bf16 default.
      KEV_DTYPE: ${KEV_DTYPE:-}
    volumes:
      # Persistent Hugging Face cache: the ~10 GB Kev-4B checkpoint is downloaded once.
      - kev-model-cache:/models/huggingface
    restart: unless-stopped
    healthcheck:
      # /v1/models includes the loaded checkpoint, device, and truncation state.
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 30m
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  kev-model-cache:
