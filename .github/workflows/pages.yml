name: Deploy catalog site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Validate catalog and build immutable-cohort pointer
        run: |
          npm install --ignore-scripts --no-package-lock --no-audit --no-fund
          node scripts/catalog.mjs --check --skip-unmapped
          node scripts/build-manifest.mjs --require-ajv --out _manifest --summary >> "$GITHUB_STEP_SUMMARY"
          node scripts/build-manifest.mjs --require-ajv --verify _manifest
      - name: Assemble site
        run: |
          mkdir -p _site/data
          cp site/index.html _site/
          cp _manifest/latest.json _manifest/manifest.json _site/
          cp data/catalog.json data/mappings.json data/catalog-source-ledger.json data/quality.json data/scores.json _site/data/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
