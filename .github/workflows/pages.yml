name: Deploy catalog site
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'data/catalog.json'
      - 'data/mappings.json'
      - 'data/technology-detection-rules.json'
      - 'data/skill-metadata.json'
      - 'scripts/manifest.mjs'
      - 'schemas/manifest.schema.json'
      - 'data/catalog-source-ledger.json'
      - 'data/quality.json'
      - 'data/scores.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Assemble site
        run: |
          mkdir -p _site/data
          cp site/index.html _site/
          MANIFEST_SOURCE_COMMIT="${{ github.sha }}" node scripts/manifest.mjs --write
          cp data/catalog.json data/mappings.json data/catalog-source-ledger.json data/quality.json data/scores.json data/technology-detection-rules.json data/manifest.json _site/data/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
