name: Regenerate catalog documentation
on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'scripts/catalog.mjs'
      - '.github/workflows/docs.yml'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  regenerate:
    if: github.repository == 'rigerc/skills-catalog'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: node scripts/catalog.mjs --write
      - uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          branch: automation/update-catalog-docs
          base: main
          delete-branch: true
          add-paths: |
            README.md
            SKILLS.md
            TECHNOLOGIES.md
            data/unmapped.json
          commit-message: 'docs: regenerate catalog'
          title: 'docs: regenerate catalog index'
          body: 'Generated from the canonical JSON snapshot. Review before merging.'
