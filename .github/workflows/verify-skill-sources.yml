name: Verify upstream skill existence
on:
  pull_request:
    paths:
      - 'data/catalog.json'
      - 'data/catalog-source-ledger.json'
  push:
    branches: [main]
    paths:
      - 'data/catalog.json'
      - 'data/catalog-source-ledger.json'

permissions:
  contents: read

jobs:
  verify-skill-sources:
    name: Verify upstream SKILL.md files
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Validate catalog before upstream requests
        run: node scripts/catalog.mjs --validate
      - name: Verify only newly added or changed pinned SKILL.md sources
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/check-changed-skill-sources.mjs --base "$BASE_SHA"
