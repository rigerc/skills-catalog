name: Comment skill quality results
# Trusted workflow_run context can write PR comments without granting write tokens
# to the untrusted pull_request workflow that evaluates upstream skill directories.
on:
  workflow_run:
    workflows: ['Skill quality gate']
    types: [completed]
permissions:
  actions: read
  contents: read
  pull-requests: write
concurrency:
  group: skill-quality-comment-${{ github.event.workflow_run.head_repository.id }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false
jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Post or update the quality report on the PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          pr_number="$(jq -r '.workflow_run.pull_requests[0].number // empty' "$GITHUB_EVENT_PATH")"
          if [ -z "$pr_number" ]; then
            pr_number="$(gh api "repos/$REPO/commits/$HEAD_SHA/pulls" \
              --jq '.[] | select(.state == "open") | .number' | head -n 1)"
          fi
          if [ -z "$pr_number" ]; then
            echo "No associated open PR; no quality comment needed."
            exit 0
          fi
          current_sha="$(gh api "repos/$REPO/pulls/$pr_number" --jq '.head.sha')"
          if [ "$current_sha" != "$HEAD_SHA" ]; then
            echo "Run is stale for PR #$pr_number ($HEAD_SHA != $current_sha); skip comment."
            exit 0
          fi
          work="$RUNNER_TEMP/skill-quality-pr-comment"
          mkdir -p "$work/report"
          if gh run download "$RUN_ID" --repo "$REPO" \
              --name skill-quality-pr-report --dir "$work/report"; then
            test -f "$work/report/skill-quality-pr-comment.md"
            report="$work/report/skill-quality-pr-comment.md"
          else
            report="$work/unavailable.md"
            printf '## Skill quality results\n\nThe workflow did not publish a quality report. See the run logs for the error.\n' > "$report"
          fi
          comment="$work/comment.md"
          printf '<!-- skill-quality-gate-report -->\n' > "$comment"
          head -c 60000 "$report" >> "$comment"
          printf '\n\n[View quality gate run](https://github.com/%s/actions/runs/%s) · Commit %s\n' \
            "$REPO" "$RUN_ID" "$HEAD_SHA" >> "$comment"
          existing="$(gh api --paginate "repos/$REPO/issues/$pr_number/comments?per_page=100" | \
            jq -r '.[] | select(.user.login == "github-actions[bot]" and ((.body // "") | contains("<!-- skill-quality-gate-report -->"))) | .id' | head -n 1)"
          if [ -n "$existing" ]; then
            jq -Rs '{body: .}' "$comment" | \
              gh api -X PATCH "repos/$REPO/issues/comments/$existing" --input - >/dev/null
            echo "Updated quality report comment $existing on PR #$pr_number"
          else
            jq -Rs '{body: .}' "$comment" | \
              gh api -X POST "repos/$REPO/issues/$pr_number/comments" --input - >/dev/null
            echo "Created quality report comment on PR #$pr_number"
          fi
