name: Publish reviewed catalog notice
on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'scripts/notice.mjs'
      - '.github/workflows/update-catalog-notice.yml'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  notice:
    if: github.repository == 'rigerc/skills-catalog'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Re-pin the reviewed notice to the merged data snapshot
        run: node scripts/notice.mjs --write --repin
      - uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          branch: automation/refresh-catalog-notice
          base: main
          delete-branch: true
          add-paths: |
            data/catalog-notice.json
          commit-message: 'chore: refresh catalog notice'
          title: 'chore: refresh catalog notice'
          body: 'Generated by scripts/notice.mjs from the canonical data snapshot. Merge so the reviewed pin and sequence stay accurate on main.'
