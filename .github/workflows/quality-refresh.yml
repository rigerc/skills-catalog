name: Refresh skill quality results
# Evaluates only missing or stale entries (new/repinned skills, or after a validator
# version/flag change) and proposes data/quality.json via a review PR.
on:
  push:
    branches: [main]
    paths:
      - 'data/catalog-source-ledger.json'
      - 'scripts/quality.mjs'
      - '.github/workflows/quality-refresh.yml'
  schedule:
    - cron: '17 8 * * 3' # Wednesdays, after the Tuesday upstream-source update
  workflow_dispatch:
    inputs:
      all:
        description: 'Re-evaluate every skill, ignoring cached results'
        type: boolean
        default: false
      max_groups:
        description: 'Maximum repositories to fetch this run (chunk a large backfill)'
        default: '20'
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: refresh-skill-quality
  cancel-in-progress: false
jobs:
  refresh:
    if: github.repository == 'rigerc/skills-catalog'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Plan missing or stale skills (no upstream requests)
        id: plan
        env:
          EXTRA: ${{ inputs.all && '--all' || '' }}
          MAX_GROUPS: ${{ inputs.max_groups || '20' }}
        run: |
          node scripts/quality.mjs --plan-refresh $EXTRA --max-groups "$MAX_GROUPS"
          echo "validator_version=$(node scripts/quality.mjs --print-version)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: validator-cache
        if: steps.plan.outputs.groups != '0'
        with:
          path: ${{ runner.temp }}/bin/skill-validator
          key: ${{ runner.os }}-${{ runner.arch }}-skill-validator-${{ steps.plan.outputs.validator_version }}-go125
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        if: steps.plan.outputs.groups != '0' && steps.validator-cache.outputs.cache-hit != 'true'
        with:
          go-version: '1.25'
          cache: false
      - name: Install pinned skill-validator
        if: steps.plan.outputs.groups != '0' && steps.validator-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          GOBIN="$RUNNER_TEMP/bin" go install "github.com/agent-ecosystem/skill-validator/cmd/skill-validator@${{ steps.plan.outputs.validator_version }}"
      - name: Use pinned skill-validator
        if: steps.plan.outputs.groups != '0'
        run: |
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/skill-validator" --version
      - name: Evaluate missing and stale skills (git transport, no API quota)
        if: steps.plan.outputs.groups != '0'
        env:
          EXTRA: ${{ inputs.all && '--all' || '' }}
          MAX_GROUPS: ${{ inputs.max_groups || '20' }}
        run: node scripts/quality.mjs --write $EXTRA --max-groups "$MAX_GROUPS" --deadline-minutes 100
      - name: Validate results
        run: |
          npm install --ignore-scripts --no-package-lock --no-audit --no-fund
          npm run validate:schemas -- --skip-unmapped
          node scripts/quality.mjs --check
          node scripts/manifest.mjs --check
      - uses: peter-evans/create-pull-request@v7
        if: steps.plan.outputs.groups != '0'
        with:
          token: ${{ github.token }}
          branch: automation/update-skill-quality
          base: main
          delete-branch: true
          add-paths: |
            data/quality.json
          commit-message: 'chore: refresh skill quality results'
          title: 'chore: refresh skill quality results'
          body: 'Generated by scripts/quality.mjs from skill-validator runs on pinned upstream skills. See the workflow run summary for counts and failures. Quality results are not a security, licensing or availability audit.'
