name: Validate canonical catalog
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * 1'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: node scripts/catalog.mjs --check
      - name: Check generated unmapped skills index
        run: node scripts/unmapped.mjs --check
      - name: Check for duplicate skills
        run: node scripts/check-duplicate-skills.mjs
      - run: node --test tests/*.test.mjs
