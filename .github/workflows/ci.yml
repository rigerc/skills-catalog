name: Validate canonical catalog
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * 1'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install JSON Schema development validator
        run: npm install --ignore-scripts --no-package-lock --no-audit --no-fund
      - name: Validate canonical JSON Schemas and negative cases
        run: npm run validate:schemas -- --self-test --skip-unmapped
      - run: node scripts/catalog.mjs --check --skip-unmapped
      - name: Check quality results invariants (offline)
        run: node scripts/quality.mjs --check
      - name: Check model score invariants (offline)
        run: node scripts/evaluate-skills.mjs --check
      - name: Check for duplicate skills
        run: node scripts/check-duplicate-skills.mjs
      - run: node --test tests/*.test.mjs
        env:
          SKIP_UNMAPPED_INDEX_CHECK: '1'
      - name: Check technology content patterns
        run: python3 -m unittest discover -s tests -p 'test_detection_patterns.py' -v
