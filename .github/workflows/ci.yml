name: Validate canonical catalog
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * 1'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install JSON Schema development validator
        run: npm install --ignore-scripts --no-package-lock --no-audit --no-fund
      - name: Validate five JSON Schemas and negative cases (including unmapped index)
        run: npm run validate:schemas -- --self-test
      - run: node scripts/catalog.mjs --check
      - name: Verify the reviewed catalog notice artifact
        run: node scripts/notice.mjs --check --base "origin/${{ github.event.pull_request.base.ref || 'main' }}"
      - name: Check generated unmapped skills index
        run: node scripts/unmapped.mjs --check
      - name: Check for duplicate skills
        run: node scripts/check-duplicate-skills.mjs
      - run: node --test tests/*.test.mjs
