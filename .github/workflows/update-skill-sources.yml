name: Update upstream skill sources
on:
  workflow_dispatch:
  schedule:
    - cron: '37 6 * * 2' # Tuesdays at 06:37 UTC

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-upstream-skill-sources
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'rigerc/skills-catalog'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Check every pinned upstream SKILL.md and update changed sources
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SKILL_UPDATE_REPORT: ${{ runner.temp }}/skill-updates.md
        run: node scripts/update-skill-sources.mjs --write
      - name: Validate updated catalog and generated docs
        run: |
          node scripts/catalog.mjs --check
          node --test tests/*.test.mjs
      - name: Open or update a review PR when sources changed
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          branch: automation/update-upstream-skill-sources
          base: main
          delete-branch: true
          add-paths: |
            data/catalog-source-ledger.json
            data/catalog.json
            data/mappings.json
            README.md
            SKILLS.md
            TECHNOLOGIES.md
          commit-message: 'chore: refresh pinned upstream skill sources'
          title: 'chore: update changed upstream SKILL.md sources'
          body-path: ${{ runner.temp }}/skill-updates.md
